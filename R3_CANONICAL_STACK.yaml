    - simulation_as_physical_embodiment_proof

derived_project_rule:
  description: >
    Perfume, Tarot, Fabbrica, cultural, commercial, media, finance-support and
    other domain projects are leaves of the same R3/IDEA-OS organism. They may
    inherit shared capabilities but do not redefine the R3 foundation.
  inheritance: R3_CAPILLARY_INHERITANCE

