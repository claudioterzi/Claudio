version: 1
name: R3_UNIVERSAL_BACKUP
updated: 2026-09-21
status: DEVELOPMENT
target: "3-2-1-1-0"

purpose: >
  Make every R3 project and shared canonical layer independently recoverable,
  with redundant copies, provenance, integrity checks and verified restore evidence.

meaning:
  three: at_least_3_copies_of_critical_state
  two: at_least_2_distinct_storage_media_or_systems
  one_offsite: at_least_1_geographically_or_provider_separate_copy
  one_offline_immutable: at_least_1_offline_or_WORM_style_copy
  zero: zero_unverified_restore_errors_before_declaring_verified

asset_classes:
  - source_code
  - canonical_manifests
  - project_state
  - memory_and_ledgers
  - provenance_and_hashes
  - configuration_without_secrets
  - encrypted_private_state
  - model_and_ranker_metadata
  - restore_instructions

storage_roles:
  github:
    role: technical_versioned_source
  google_drive:
    role: owner_visible_canonical_document_copy
  nas:
    role: local_redundant_storage
  offsite_runtime_or_vps:
    role: geographically_or_provider_separate_copy
  offline_or_worm:
    role: immutable_recovery_copy
    state: REQUIRED_FOR_VERIFIED_STATUS

restore_gate:
  required:
    - source_hashes_verified
    - canonical_manifest_loaded
    - project_specific_state_restored
    - provenance_chain_valid
    - secrets_rebound_from_authorized_runtime_not_backup_plaintext
    - critical_function_smoke_tests_pass
    - restored_state_matches_expected_postconditions
  rule: >
    Backup success is not proven by file existence or sync success. VERIFIED
    requires an actual restore test against authoritative expected state.

capillary_rule:
  inherit_to_every_project: true
  shared_layers_backed_up_once_canonically: true
  project_unique_state_backed_up_per_project: true
  private_payloads:
    mode: encrypted_or_owner_private_storage
    public_copy: forbidden
    taraka_handoff: SEALED_reference_and_hash_only

current_truth:
  universal_backup_verified: false
  reason: >
    The target architecture is canonical, but the complete 3-2-1-1-0 evidence
    set, including offline/immutable copy and end-to-end restore verification,
    is not yet complete. Do not claim full verification until restore evidence exists.
