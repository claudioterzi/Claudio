name: CI & Security Scans

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**requirements*.txt'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch: {}

jobs:
  ci_security:
    name: Tests (blocking) + advisory scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:integrations/raffaello-bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies + tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r r3/requirements.txt -r integrations/raffaello-bot/requirements.txt mistralai
          pip install --no-cache-dir ruff mypy pytest pytest-timeout coverage bandit pip-audit detect-secrets

      - name: Run ruff (lint)
        continue-on-error: true
        run: |
          ruff check . --format=github > ruff.txt || true

      - name: Run mypy (typing)
        continue-on-error: true
        run: |
          mypy sdq1 --show-error-codes || true

      - name: Run pytest once with coverage (blocking)
        run: |
          python -m coverage run -m pytest -q

      - name: Export coverage, including failed runs
        if: always()
        run: python -m coverage xml -i

      - name: Run pip-audit (vulns)
        continue-on-error: true
        run: |
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt -f json -o pip_audit.json || true; fi

      - name: Run bandit (security static)
        continue-on-error: true
        run: |
          bandit -r sdq1 -f json -o bandit.json || true

      - name: Run detect-secrets (quick scan)
        continue-on-error: true
        run: |
          detect-secrets scan --all-files > detect_secrets.out || true

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-security-artifacts
          path: |
            ruff.txt
            pip_audit.json
            bandit.json
            detect_secrets.out
            coverage.xml

      # Reports stay in run artifacts: a timestamp must not redeploy the site.
