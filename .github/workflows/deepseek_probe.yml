name: DeepSeek Provider Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install provider dependency
        run: python -m pip install --quiet 'openai>=1.50.0'

      - name: Probe DeepSeek via SDQ-1 provider
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, sys
          from datetime import datetime, timezone
          from pathlib import Path
          from sdq1.llm.providers import DeepSeekProvider

          configured = bool(os.getenv('DEEPSEEK_API_KEY'))
          result = {
              'timestamp': datetime.now(timezone.utc).isoformat(),
              'executor': 'GitHub Actions',
              'provider': 'deepseek',
              'requested_model': 'deepseek-flash',
              'configured': configured,
              'ok': False,
              'effective_model': None,
              'latency_ms': None,
              'error': None,
          }

          if configured:
              p = DeepSeekProvider(
                  modello='deepseek-flash', api_key=None,
                  max_token=24, temperatura=0.0, timeout_secondi=20,
              )
              r = p.completa('Rispondi soltanto con PONG.', 'ping')
              result['ok'] = bool(r.via_api and r.testo.strip())
              result['effective_model'] = r.modello
              result['latency_ms'] = r.latenza_ms
              if r.errore:
                  err = re.sub(r'sk-[A-Za-z0-9_-]+', 'sk-REDACTED', str(r.errore))
                  result['error'] = err[:300]
          else:
              result['error'] = 'DEEPSEEK_API_KEY non configurata nei GitHub Actions secrets'

          Path('output').mkdir(exist_ok=True)
          Path('output/deepseek_probe.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({k: result[k] for k in ('provider','configured','ok','effective_model','latency_ms','error')}, ensure_ascii=False))
          if not result['ok']:
              sys.exit(1)
          PY

      - name: Preserve probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-probe
          path: output/deepseek_probe.json
          if-no-files-found: error
          retention-days: 1
