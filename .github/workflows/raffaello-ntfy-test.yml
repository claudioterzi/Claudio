name: RaffaelloCrypto ntfy test
on:
  push:
    branches: [raffaello-crypto-scout]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send one ntfy test
        run: curl --fail --silent --show-error "https://ntfy.sh/raffaellocrypto/publish?title=RaffaelloCrypto%20TEST&message=TEST%20REALE%20-%20ponte%20GitHub%20Actions%20a%20ntfy%20funzionante.%20Non%20e%20un%20ordine%20di%20trading.&priority=high&tags=white_check_mark"
