name: RaffaelloCrypto ntfy test

on:
  push:
    branches:
      - raffaello-crypto-scout
    paths:
      - ".github/workflows/raffaello-ntfy-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test notification to ntfy
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          RESP="$(curl --fail-with-body --silent --show-error             -H 'Title: RaffaelloCrypto · TEST'             -H 'Priority: high'             -H 'Tags: white_check_mark,chart_with_upwards_trend'             -d "✅ TEST RAFFAELLO CRYPTO
Canale collegato: GitHub Actions → ntfy → iPhone
UTC: $TS"             https://ntfy.sh/raffaellocrypto)"
          echo "$RESP"
