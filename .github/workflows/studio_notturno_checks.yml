name: SDQ-1 Studio workflow checks

on:
  push:
    paths:
      - '.github/workflows/studio_notturno.yml'
      - '.github/workflows/studio_notturno_checks.yml'
      - 'tests/test_studio_notturno_workflow.py'
      - 'tests/test_studio_notturno_generation.py'
      - 'scripts/studio_notturno.py'
  pull_request:
    paths:
      - '.github/workflows/studio_notturno.yml'
      - '.github/workflows/studio_notturno_checks.yml'
      - 'tests/test_studio_notturno_workflow.py'
      - 'tests/test_studio_notturno_generation.py'
      - 'scripts/studio_notturno.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Test cache, missing credentials, generation and push failures
        run: python -m unittest discover -s tests -p 'test_studio_notturno_*.py' -v
