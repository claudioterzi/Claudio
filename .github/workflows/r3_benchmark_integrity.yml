name: R3 Benchmark Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'sdq1/benchmark_integrity.py'
      - 'tests/test_benchmark_integrity.py'
      - '.github/workflows/r3_benchmark_integrity.yml'
  workflow_dispatch:

jobs:
  phase0-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run R3-019 Phase-0 regression tests
        run: python -m unittest discover -s tests -p 'test_benchmark_integrity.py' -v
