name: Test Runner

on:
  push:
    branches: [main]
    paths:
      - 'public/r3-memory.js'
      - 'public/home.html'
      - 'public/agora.js'
      - 'tests/test_core_ergonomia.cjs'
      - 'tests/r3-memory-integrity.cjs'
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/test_runner.yml'
      - 'tests/test_alpha74_frontend.cjs'
      - 'tarocchi_quantici_alpha.json'
      - 'public/alpha*.js'
      - 'public/tarocchi*.html'
      - 'public/images/alpha74/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ergonomia:
    name: Ergonomia, accessi e integrita dei contenuti
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dipendenze dei controlli locali
        run: |
          python -m pip install flask PyYAML pytest Pillow beautifulsoup4 httpx 'fakeredis[lua]'
          npm ci --prefix tests --ignore-scripts
      - name: Navigazione, dati, annullamento, cataloghi e documenti
        run: |
          node --test tests/test_core_ergonomia.cjs
          node tests/test_status_freshness.cjs
          node tests/test_alpha_travel_ergonomics.cjs
          node tests/test_profumi_ergonomia.cjs
          node tests/test_multimedia_ergonomics.cjs
          node tests/test_alpha74_frontend.cjs
          node tests/test_perfume_bottle.cjs
          node tests/test_perfume_lab.cjs
      - name: Accesso ai provider e archivio
        run: |
          python -m pytest tests/test_agora.py tests/test_alpha_guest_safety.py tests/test_guest_voice_ergonomia.py tests/test_provider_owner_authorization.py tests/test_perfume_restore.py tests/test_perfume_studio.py tests/test_reader_generators.py -q
      - name: Asset del frontend RRREMERGEN serviti dalle rotte
        run: python -m pytest tests/test_rrremergen_static_assets.py -q
      - name: Identita delle 400 formule e immagini
        run: python scripts/verifica_flaconi_400.py --report /tmp/formule-ergonomia.json

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install anthropic "openai>=1.50.0" "google-genai>=1.0.0" pyyaml flask mistralai 'fakeredis[lua]'

      - name: Verifica import principali
        run: |
          python -c "from tarocchi import MAZZO, cerca_carta; print(f'Mazzo OK: {len(MAZZO)} carte')"
          python -c "from sdq1.notifiche import invia; print('notifiche OK')"
          python -c "from sdq1.llm.providers import AnthropicProvider; print('providers OK')"

      - name: Verifica Flask app
        run: |
          python -c "import tarocchi_web; print('Flask app OK')"

      - name: Setup Node per la Fabbrica
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Alpha 74 canone e frontend
        run: |
          python -m unittest tests.test_alpha_web tests.test_tarot_alpha_follow_up
          node tests/test_alpha74_frontend.cjs

      - name: Router LLM — fallback su modello alternativo
        run: python -m unittest tests.test_router_fallback tests.test_consiglio_fallback

      - name: Agorà — delibere firmate e webhook del bot
        run: python -m unittest tests.test_agora tests.test_agora_web

      - name: Travelpayouts — prezzi finiti sull'head esatto
        run: python -m unittest -v tests.test_travelpayouts_finite_price tests.test_viaggi_validation

      - name: Verifica Fabbrica, TypeSafe e dialogo IA
        run: |
          python -m unittest discover -s tests -p 'test_fabbrica*.py'
          python -m unittest discover -s tests -p 'test_typesafe*.py'
          npm ci --prefix tests --ignore-scripts
          npm run --prefix tests test:fabbrica

      - name: Test mazzo completo
        run: |
          python -c "
          from tarocchi import MAZZO, cerca_carta
          assert len(MAZZO) == 78, f'Attese 78 carte, trovate {len(MAZZO)}'
          carta = cerca_carta('il matto')
          assert carta is not None, 'Il Matto non trovato'
          print('Test mazzo: OK')
          "

      - name: "R3 memory integrity: snapshot and delayed-lock regression"
        run: |
          node --check public/r3-memory.js
          node --check tests/r3-memory-integrity.cjs
          R3_TEST_OUTPUT=/tmp/r3-memory-integrity.json node tests/r3-memory-integrity.cjs public/r3-memory.js

      - name: Test R3-019 controlled baseline
        run: python -m unittest tests.test_benchmark_controlled

      - name: Test R3 canonical stack
        run: python -m unittest tests.test_r3_canonical_stack

      - name: Test JsonFileStore startup corruption guard
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.TestSuite(unittest.defaultTestLoader.discover('tests', pattern=name) for name in ('test_json_store_startup_guard.py', 'test_json_store_decode_guard.py'))
          if suite.countTestCases() != 21:
              raise SystemExit('Expected exactly 21 JsonFileStore startup guard tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 21 or not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          PY

  snapshot-safety:
    name: Snapshot safety - exact head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Python for snapshot safety
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing CLI configuration dependency
        run: python -m pip install 'PyYAML>=6.0'
      - name: R3 API admission gates on exact candidate head
        run: |
          python -m pip install 'Flask>=3.0,<4'
          python -m unittest -v tests.test_r3_api_adoption_gates
      - name: Verify snapshot contract in full repository
        env:
          GIT_ALLOW_PROTOCOL: file
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git rev-parse HEAD
          python scripts/r3_ai_bootstrap.py --check
          python - <<'PY'
          import json, pathlib, re, subprocess, sys, unittest
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          print('R3_SNAPSHOT_TESTED_HEAD=' + head, flush=True)
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          pattern = re.compile(r'sdq1\.snapshot|from \.snapshot|salva_snapshot|push_snapshot|output[/\\]snapshots|chore\(snapshot\)|--snapshot')
          extensions = {'.py', '.js', '.ts', '.cjs', '.mjs', '.sh', '.ps1', '.cmd', '.bat', '.yml', '.yaml'}
          hits = []
          scanned = 0
          for name in paths:
              p = pathlib.Path(name)
              if not name or p.suffix.lower() not in extensions or p.is_symlink():
                  continue
              scanned += 1
              for number, line in enumerate(p.read_text(encoding='utf-8-sig').splitlines(), 1):
                  if pattern.search(line):
                      hits.append({'path': name, 'line': number, 'excerpt': line.strip()[:250]})
          print('R3_TRACKED_CONSUMER_INVENTORY=' + json.dumps({'head': head, 'tracked_files': len([x for x in paths if x]), 'source_files_scanned': scanned, 'matches': hits}, ensure_ascii=True), flush=True)
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(name) for name in ('tests.test_snapshot_solution', 'tests.test_snapshot_consumers'))
          if suite.countTestCases() != 31:
              raise SystemExit('Expected exactly 31 snapshot and consumer tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 31 or not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          print('R3_SNAPSHOT_RESULT=31_PASS_0_SKIP', flush=True)
          PY
          python -m py_compile sdq1/snapshot.py sdq1/__main__.py sdq1/notifiche.py tests/test_snapshot_solution.py tests/test_snapshot_consumers.py
          git diff --exit-code -- sdq1/snapshot.py tests/test_snapshot_solution.py
