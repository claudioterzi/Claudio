name: R3 RRR Control

on:
  pull_request:
    branches: [main]
    paths:
      - 'r3/**'
      - 'tests/test_r3_rrr_control.py'
      - 'tests/test_r3_rrr_two_process.py'
      - 'tests/test_r3_rrr_offline_rejoin.py'
      - 'tests/test_r3_rrr_stale_peer_rejoin.py'
      - 'tests/test_r3_persistence_readiness.py'
      - 'tests/test_r3_sync_replication_proof.py'
      - 'tests/test_r3_redundancy_repair.py'
      - 'tests/test_backup_recoverability.py'
      - 'Dockerfile.r3-railway'
      - 'scripts/r3_restart_proof.py'
      - 'sdq1/__main__.py'
      - '.github/workflows/r3_rrr_control.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install R3 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r r3/requirements.txt pytest

      - name: Compile changed Python
        run: |
          python -m py_compile r3/rrr_control.py r3/node.py r3/sync.py sdq1/__main__.py scripts/r3_restart_proof.py

      - name: RRR control contract
        run: |
          python -m pytest -q tests/test_r3_rrr_control.py tests/test_r3_rrr_two_process.py tests/test_r3_rrr_offline_rejoin.py tests/test_r3_rrr_stale_peer_rejoin.py tests/test_r3_persistence_readiness.py tests/test_r3_sync_replication_proof.py tests/test_r3_redundancy_repair.py tests/test_backup_recoverability.py
