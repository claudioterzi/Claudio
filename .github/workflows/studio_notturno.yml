name: SDQ-1 Studio Notturno

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC; Brussels: 01:00 winter, 02:00 summer
  workflow_dispatch:

concurrency:
  group: sdq1-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  studia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Verifica configurazione Studio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY non configurata: studio NON eseguito, nessun nuovo Morning Brief."
            printf '%s\n' '## Studio bloccato' 'ANTHROPIC_API_KEY non disponibile. Nessuno studio eseguito e nessun nuovo Morning Brief generato. Configurare il secret in Settings > Secrets and variables > Actions, poi avviare una nuova esecuzione.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # No pip cache: installation deliberately uses --no-cache-dir.

      - name: Configura git
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"

      - name: Installa dipendenze
        run: python3 -m pip install --quiet --no-cache-dir anthropic

      - name: Studio Notturno
        run: |
          python3 scripts/studio_notturno.py
          brief="output/morning_brief/$(date -u +%Y-%m-%d).md"
          if [ ! -s "$brief" ]; then
            echo "::error::Morning Brief del giorno assente o vuoto: pubblicazione interrotta."
            exit 1
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: UTC

      - name: Salva Morning Brief nel repo
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add output/morning_brief/
          if git diff --staged --quiet; then
            printf '%s\n' '## Nessuna modifica da salvare' 'Il contenuto generato coincide con quello gia presente. Nessun nuovo commit creato.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "morning brief $(date -u +%Y-%m-%d) [skip ci]"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf '%s\n' '## Morning Brief salvato' "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
