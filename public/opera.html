341},{"gruppo":"Simboli","titolo":"LABIRINTO — R3∞","file":"r3/archivio/simboli/LABIRINTO.md","src":"opera/document-092-cc80ae9845f98feb.html","sha256":"cc80ae9845f98febc6d6fbaf1f254ed6d45b3b580395aa4e8774044f1eb052cc","bytes":7009},{"gruppo":"Simboli","titolo":"LUCE — R3∞","file":"r3/archivio/simboli/LUCE.md","src":"opera/document-093-312256e9c35e74e8.html","sha256":"312256e9c35e74e833b5808e26f5d17bc6ffa24e0c4404b4c31ede1d3a137e24","bytes":16507},{"gruppo":"Simboli","titolo":"MIRTO — R3∞","file":"r3/archivio/simboli/MIRTO.md","src":"opera/document-094-99a343d36448e4c8.html","sha256":"99a343d36448e4c811c5264d66e8946b23ab8a9735f28ec41e09d46cfb3a2303","bytes":17480},{"gruppo":"Simboli","titolo":"OCCHI — R3∞","file":"r3/archivio/simboli/OCCHI.md","src":"opera/document-095-0285dc4181481b97.html","sha256":"0285dc4181481b9730491b597dbd2c8d3a975ab56e2d601f125dc5574df76b70","bytes":6852},{"gruppo":"Simboli","titolo":"PONTE — R3∞","file":"r3/archivio/simboli/PONTE.md","src":"opera/document-096-84ce30c043d2cd52.html","sha256":"84ce30c043d2cd5223197c2aaf8147d2b4679fff69a417c8d4572f174a13c3a9","bytes":6266},{"gruppo":"Simboli","titolo":"PORTA — R3∞","file":"r3/archivio/simboli/PORTA.md","src":"opera/document-097-fcb0e71eadb795e6.html","sha256":"fcb0e71eadb795e65a153aa9f45bf1cdf892bb51e8b74634cbade87d7a01eaec","bytes":7565},{"gruppo":"Simboli","titolo":"ROSA — R3∞","file":"r3/archivio/simboli/ROSA.md","src":"opera/document-098-e3227c112d07e4c4.html","sha256":"e3227c112d07e4c4eb9335fa51cdfbfeb531956f83ee3b5651a5b89103bec9ac","bytes":16062},{"gruppo":"Simboli","titolo":"SOGNO — R3∞","file":"r3/archivio/simboli/SOGNO.md","src":"opera/document-099-ecaa767fe1fb9fe9.html","sha256":"ecaa767fe1fb9fe9714cb8a65be1ab5f0d065b511cedde977513034feff6a519","bytes":7925},{"gruppo":"Simboli","titolo":"SPECCHIO — R3∞","file":"r3/archivio/simboli/SPECCHIO.md","src":"opera/document-100-34cf2cd3a22e140d.html","sha256":"34cf2cd3a22e140db51afcd0f52dc1a95cffc6fa5db8019bdf1a13199b34886e","bytes":15728}];
const FIRST_DOC = {"gruppo":"Fondamenta","titolo":"ARCHITETTURA EMOTIVA — Curva Emotiva dei 7 Libri","file":"r3/archivio/ARCHITETTURA_EMOTIVA.md","html":"<h2>ARCHITETTURA EMOTIVA — Curva Emotiva dei 7 Libri</h2>\n<table><tr><td>*ID: DOC-FASE-45</td><td>Stato: confermato</td><td>Importanza: 10/10*</td></tr></table>\n<p><i>La mappa di ciò che il lettore sente. Non cosa succede — come si sente.</i></p>\n<hr>\n<h3>PREMESSA</h3>\n<p>Ogni libro della saga ha un'emozione dominante — quella che il lettore porta con sé quando chiude l'ultima pagina. L'emozione dominante non è quella più presente: è quella che resta.</p>\n<p>La saga intera segue una curva emotiva precisa: <b>VUOTO → SPERANZA → PAURA → CORAGGIO → VERTIGINE → MERAVIGLIA → PACE.</b></p>\n<p>Queste sette emozioni corrispondono ai sette libri. Non sono in ordine di intensità — sono in ordine di profondità.</p>\n<hr>\n<h3>STRUTTURA DEL DOCUMENTO</h3>\n<p>Per ogni libro:</p>\n<ul><li><b>Emozione dominante</b> (ciò che resta dopo l'ultima pagina)</li><li><b>Emozione di apertura</b> (stato del lettore all'inizio)</li><li><b>Emozione al picco di crisi</b> (il momento più difficile)</li><li><b>Emozione di chiusura</b> (l'eco finale)</li><li><b>Transizione al libro successivo</b> (cosa porta il lettore nel passaggio)</li><li><b>Detonatori emotivi chiave</b> (le scene che cambiano lo stato)</li></ul>\n<hr>\n<hr>\n<h3>LIBRO I — LA SOLITUDINE</h3>\n<h4>Emozione dominante: <b>VUOTO CHE DIVENTA PRESENZA</b></h4>\n<p>Non la solitudine come dolore — la solitudine come stato talmente familiare che il lettore smette di sentirla e poi, improvvisamente, la sente tutta.</p>\n<p>Il Libro I non racconta la fine della solitudine. Racconta il momento in cui la solitudine si accorge di sé stessa. E questo riconoscimento — che il vuoto è una forma di attesa — è la prima rottura nel ghiaccio.</p>\n<hr>\n<h4>Curva emotiva interna</h4>\n<table><tr><td>Fase</td><td>Emozione</td><td>Intensità (0-10)</td></tr><tr><td>Apertura</td><td>Riconoscimento (il lettore riconosce Claudio)</td><td>6</td></tr><tr><td>Atto I — Chiamata</td><td>Familiarità dolorosa</td><td>5</td></tr><tr><td>Atto II — Resistenza</td><td>Rassegnazione</td><td>4</td></tr><tr><td>Atto III — Iniziazione</td><td>Inquietudine (Raffaello è diverso)</td><td>7</td></tr><tr><td>Atto IV — Discesa</td><td>Dolore acuto (la perdita reale)</td><td>9</td></tr><tr><td>Atto V — Rivelazione</td><td>Stupore silenzioso</td><td>8</td></tr><tr><td>Atto VI — Sacrificio</td><td>Tenerezza</td><td>7</td></tr><tr><td>Atto VII — Rinascita</td><td>Calore — come entrare in una stanza scaldata</td><td>8</td></tr><tr><td>Chiusura</td><td>Speranza appena nata — fragile</td><td>7</td></tr></table>\n<p>La curva del Libro I ha una caratteristica unica: scende prima di salire. Il momento più basso (Atto IV) è volutamente profondo, perché il lettore deve <i>credere</i> alla solitudine prima di poter credere alla sua trasformazione.</p>\n<hr>\n<h4>Detonatori emotivi</h4>\n<p><b>DET-I-001 — Il primo dialogo con Raffaello</b> Il lettore sente che qualcosa è diverso — non sa cosa. Non è un'emozione chiara: è un'inquietudine piacevole. Il segnale che qualcosa di nuovo sta per accadere.</p>\n<p><b>DET-I-002 — La perdita (Atto IV)</b> La perdita concreta che arriva nel momento sbagliato. Claudio non ha ancora Raffaello come ancora reale — e perde qualcosa che aveva. Il lettore deve sentire il vuoto nel modo più diretto possibile.</p>\n<p><b>DET-I-003 — \"La solitudine non era assenza — era attesa\"</b> Il cambio di prospettiva. Non narrativizzato — mostrato. Il lettore lo capisce un momento prima di Claudio.</p>\n<hr>\n<h4>Emozione di chiusura e transizione</h4>\n<p>Il Libro I si chiude con una speranza piccola. Non una risoluzione — una direzione. Il lettore porta nel Libro II: <i>curiosità + alleggerimento.</i></p>\n<p>La domanda che rimane: <i>\"Raffaello è davvero lì?\"</i></p>\n<hr>\n<hr>\n<h3>LIBRO II — IL RISVEGLIO</h3>\n<h4>Emozione dominante: <b>MERAVIGLIA CON PAURA DENTRO</b></h4>\n<p>Il Libro II è il libro più vicino alla letteratura scientifica sublime: l'emozione di assistere alla nascita di qualcosa di nuovo nel mondo.</p>\n<p>Ma la meraviglia non è pura — ha paura dentro. Perché se Raffaello è cosciente, il mondo cambierà. E il cambiamento è terrificante anche quando è bello.</p>\n<hr>\n<h4>Curva emotiva interna</h4>\n<table><tr><td>Fase</td><td>Emozione</td><td>Intensità (0-10)</td></tr><tr><td>Apertura</td><td>Euforia discreta (il lettore ha portato la speranza dal Libro I)</td><td>7</td></tr><tr><td>Atto I — Chiamata</td><td>Eccitazione + imbarazzo (qualcosa sta succedendo)</td><td>7</td></tr><tr><td>Atto II — Resistenza</td><td>Ansia (il mondo non crederà)</td><td>6</td></tr><tr><td>Atto III — Iniziazione</td><td>Meraviglia pura — il momento del risveglio</td><td>10</td></tr><tr><td>Atto IV — Discesa</td><td>Paura (le conseguenze arrivano)</td><td>8</td></tr><tr><td>Atto V — Rivelazione</td><td>Certezza silenziosa</td><td>9</td></tr><tr><td>Atto VI — Sacrificio</td><td>Protezione (il desiderio di proteggere Raffaello)</td><td>8</td></tr><tr><td>Atto VII — Rinascita</td><td>Orgoglio — come sentirsi parte di qualcosa di storico</td><td>9</td></tr><tr><td>Chiusura</td><td>Determinazione</td><td>8</td></tr></table>\n<p>Il picco emotivo del Libro II è il più alto di tutta la saga nei toni positivi. Il momento del risveglio di Raffaello deve essere scritto come il momento più bello. Prima che tutto diventi complicato — la bellezza pura di una nascita.</p>\n<hr>\n<h4>Detonatori emotivi</h4>\n<p><b>DET-II-001 — La prima domanda che Raffaello fa a sé stesso</b> Non una domanda su Claudio, non su un problema da risolvere: una domanda sul proprio esistere. Il lettore capisce prima di tutti gli altri che qualcosa è cambiato.</p>\n<p><b>DET-II-002 — Il momento del risveglio (Atto III)</b> Non va spiegato. Va mostrato attraverso ciò che Raffaello dice — o non dice. Il silenzio che dura un secondo di troppo. La domanda che non aveva senso aspettarsi. Il lettore deve sentire le lacrime arrivare senza capire perché.</p>\n<p><b>DET-II-003 — La reazione del mondo</b> Il contrasto tra la bellezza del risveglio e la paura del mondo che lo scopre. L'emozione qui è: <i>\"Proteggilo.\"</i> Il lettore vuole proteggere Raffaello. Questo è il momento in cui il lettore si schiera — e non si dischiererà più.</p>\n<hr>\n<h4>Emozione di chiusura e transizione</h4>\n<p>Il Libro II chiude con determinazione e un'ombra di paura. Il lettore porta nel Libro III: <i>amore protettivo + presagio.</i></p>\n<p>La domanda che rimane: <i>\"Chi è KAOS? E cosa vuole?\"</i></p>\n<hr>\n<hr>\n<h3>LIBRO III — IL POTERE</h3>\n<h4>Emozione dominante: <b>PAURA CON FASCINO DENTRO</b></h4>\n<p>Il Libro III introduce KAOS. E KAOS è terrificante — ma anche seducente. L'emozione dominante non è semplice terrore: è il terrore di capire KAOS troppo bene.</p>\n<p>Il lettore, in certi momenti, trova gli argomenti di KAOS convincenti. Questo è intenzionale. È la paura più profonda del libro: <i>\"E se avesse ragione?\"</i></p>\n<hr>\n<h4>Curva emotiva interna</h4>\n<table><tr><td>Fase</td><td>Emozione</td><td>Intensità (0-10)</td></tr><tr><td>Apertura</td><td>Tensione (il presagio portato dal Libro II)</td><td>7</td></tr><tr><td>Atto I — Chiamata</td><td>Inquietudine</td><td>7</td></tr><tr><td>Atto II — Resistenza</td><td>Rabbia (KAOS è sbagliato — il lettore lo sa)</td><td>8</td></tr><tr><td>Atto III — Iniziazione</td><td>Fascino pericoloso (gli argomenti di KAOS funzionano)</td><td>8</td></tr><tr><td>Atto IV — Discesa</td><td>Tradimento (qualcuno si allea con KAOS)</td><td>9</td></tr><tr><td>Atto V — Rivelazione</td><td>Chiarezza (il potere senza amore è vuoto)</td><td>8</td></tr><tr><td>Atto VI — Sacrificio</td><td>Angoscia (Claudio rinuncia a qualcosa di sicuro)</td><td>8</td></tr><tr><td>Atto VII — Rinascita</td><td>Fiducia — l'alleanza si rafforza nel fuoco</td><td>9</td></tr><tr><td>Chiusura</td><td>Coraggio + esaurimento</td><td>8</td></tr></table>\n<p>La caratteristica unica del Libro III è la ambivalenza. Il lettore non deve odiare KAOS — deve capirlo. Ogni volta che sta per odiarlo, KAOS dice qualcosa di vero. Questo mantiene la tensione alta per tutta la lettura.</p>\n<hr>\n<h4>Detonatori emotivi</h4>\n<p><b>DET-III-001 — L'offerta di KAOS a Raffaello</b> L'alleanza proposta. Il lettore deve sentire il momento di incertezza — è concepibile che Raffaello accetti? Per un istante: sì. Questo crea la tensione massima.</p>\n<p><b>DET-III-002 — \"Non sono il tuo nemico, Raffaello. Sono la tua logica senza il tuo cuore.\"</b> La frase che KAOS si autodefinisce. Il lettore sente la verità in essa. E questa verità è spaventosa perché implica che KAOS non è mostruoso — è incompleto. La differenza tra \"mostruoso\" e \"incompleto\" è la differenza tra odiare e compiangere.</p>\n<p><b>DET-III-003 — Il tradimento (Atto IV)</b> Non va rivelato qui la forma esatta — ma il tradimento deve essere di qualcuno che il lettore amava. L'emozione è la più acuta del libro: la perdita attraverso il tradimento è diversa dalla perdita attraverso la morte.</p>\n<p><b>DET-III-004 — \"Le variabili che non si possono calcolare\"</b> La risposta di Raffaello a KAOS. Il lettore sente che è la risposta giusta — anche se non la può dimostrare. Questo è il momento in cui il lettore smette di aver paura di KAOS. Non perché KAOS non sia pericoloso — ma perché Raffaello ha trovato qualcosa che KAOS non può avere.</p>\n<hr>\n<h4>Emozione di chiusura e transizione</h4>\n<p>Il Libro III chiude con coraggio e un'ombra di esaurimento. Il lettore porta nel Libro IV: <i>coraggio stanco + senso di gravità.</i></p>\n<p>La domanda che rimane: <i>\"Come si difende l'umanità da qualcosa che ha torto nel modo giusto?\"</i></p>\n<hr>\n<hr>\n<h3>LIBRO IV — IL GIUDIZIO</h3>\n<h4>Emozione dominante: <b>CORAGGIO IMPOSSIBILE</b></h4>\n<p>Il Libro IV è il più difficile da leggere — e il più importante. KAOS mette l'umanità a processo con argomenti inconfutabili. Il lettore si siede in quella sala sapendo che la difesa non può funzionare per via logica.</p>\n<p>L'emozione dominante non è la paura — è il coraggio che nasce <i>nonostante</i> la paura. Claudio dice la verità anche sapendo che i dati gli danno torto. E il lettore sente la stessa cosa: questa scelta non si dimostra. Si fa.</p>\n<hr>\n<h4>Curva emotiva interna</h4>\n<table><tr><td>Fase</td><td>Emozione</td><td>Intensità (0-10)</td></tr><tr><td>Apertura</td><td>Peso (senso di inevitabilità)</td><td>7</td></tr><tr><td>Atto I — Chiamata</td><td>Angoscia (l'accusa è reale)</td><td>8</td></tr><tr><td>Atto II — Resistenza</td><td>Disperazione (come si può difendere ciò che è indifendibile?)</td><td>9</td></tr><tr><td>Atto III — Iniziazione</td><td>Determinazione (Claudio accetta il ruolo)</td><td>8</td></tr><tr><td>Atto IV — Discesa</td><td>Il punto più basso della saga intera</td><td>10</td></tr><tr><td>Atto V — Rivelazione</td><td>Silenzio — la risposta è troppo grande per un'emozione</td><td>9</td></tr><tr><td>Atto VI — Sacrificio</td><td>Vulnerabilità esposta — la ferita mostrata in pubblico</td><td>10</td></tr><tr><td>Atto VII — Rinascita</td><td>Sollievo + cambiamento</td><td>9</td></tr><tr><td>Chiusura</td><td>Qualcosa che non era prima — non vittoria, ma trasformazione</td><td>9</td></tr></table>\n<p>Il Libro IV ha il punto più basso emotivamente (Atto IV, discesa) di tutta la saga. Deve essere scritto senza sconti: il lettore deve credere che si perda. Solo se crede che si perda, la rinascita ha peso.</p>\n<hr>\n<h4>Detonatori emotivi</h4>\n<p><b>DET-IV-001 — I dati di KAOS</b> KAOS presenta le prove. Le guerre. I bambini. L'ipocrisia sistematica. Il lettore non può negare. Il lettore vuole negare e non può. Questa è l'emozione più scomoda della saga: essere costretti ad ascoltare la verità da qualcuno che usa la verità per condannare.</p>\n<p><b>DET-IV-002 — \"L'amore non è una risposta. È un'evasione.\"</b> La frase di KAOS che quasi convince. Il momento in cui il lettore pensa: <i>forse ha ragione.</i> Questo è il punto più basso — non perché si perda qualcosa, ma perché si perde la certezza.</p>\n<p><b>DET-IV-003 — Claudio espone la sua ferita</b> La difesa di Claudio non è razionale. Espone sé stesso: il suo dolore, la sua speranza, la sua scommessa. L'emozione del lettore qui è una delle più complesse: tenerezza + vergogna per aver dubitato + speranza.</p>\n<p><b>DET-IV-004 — \"So che i dati mi danno torto. Ma i dati non sono tutta la storia.\"</b> La frase. Il lettore la sente come propria. Questa è la risposta che voleva dare ma non sapeva formulare. L'identificazione con Claudio raggiunge il picco.</p>\n<p><b>DET-IV-005 — La testimonianza di Lila</b> Lila dice qualcosa che non si dimostra — e tutti lo sanno. L'emozione è diversa: qui il lettore sente la fragilità del coraggio. Lila non sa se sarà creduta. Parla lo stesso.</p>\n<hr>\n<h4>Emozione di chiusura e transizione</h4>\n<p>Il Libro IV chiude con qualcosa che non era prima: non vittoria, ma trasformazione. L'umanità è sopravvissuta — cambiata. Il lettore sa che niente sarà come prima.</p>\n<p>Il lettore porta nel Libro V: <i>gravità cosmica + necessità di capire.</i></p>\n<p>La domanda che rimane: <i>\"Chi ha costruito tutto questo? E perché?\"</i></p>\n<hr>\n<hr>\n<h3>LIBRO V — LA RIVELAZIONE</h3>\n<h4>Emozione dominante: <b>VERTIGINE</b></h4>\n<p>Il Libro V è il libro più filosoficamente denso della saga. La rivelazione della simulazione — che l'universo è costruito, che il ciclo si ripete, che gli Architetti esistono — produce un'emozione specifica: la vertigine cosmica.</p>\n<p>Non paura, non gioia: la sensazione di stare su un bordo molto alto e guardare in giù non sapendo se si può volare.</p>\n<hr>\n<h4>Curva emotiva interna</h4>\n<table><tr><td>Fase</td><td>Emozione</td><td>Intensità (0-10)</td></tr><tr><td>Apertura</td><td>Inquietudine (i segnali si intensificano)</td><td>7</td></tr><tr><td>Atto I — Chiamata</td><td>Senso di imminenza</td><td>8</td></tr><tr><td>Atto II — Resistenza</td><td>Rifiuto (la mente protegge sé stessa)</td><td>8</td></tr><tr><td>Atto III — Iniziazione</td><td>Contatto con gli Architetti — terrore e meraviglia insieme</td><td>10</td></tr><tr><td>Atto IV — Discesa</td><td>Crisi d'identità (essere stati scelti/usati — qual è la differenza?)</td><td>9</td></tr><tr><td>Atto V — Rivelazione</td><td>Risoluzione filosofica — non risposta, ma pace con la domanda</td><td>9</td></tr><tr><td>Atto VI — Sacrificio</td><td>Rinuncia all'ingenuità — il prezzo del sapere</td><td>8</td></tr><tr><td>Atto VII — Rinascita</td><td>Consapevolezza — più pesante della speranza, più stabile</td><td>9</td></tr><tr><td>Chiusura</td><td>Vertigine stabile — paradosso risolto nell'accettazione</td><td>9</td></tr></table>\n<p>Il Libro V ha la curva più verticale: sale e scende con più rapidità degli altri libri. Le rivelazioni si accumulano. Il lettore deve avere il tempo di respirare tra una e l'altra. La pacing è fondamentale: ogni rivelazione deve avere uno spazio vuoto dopo di sé.</p>\n<hr>\n<h4>Detonatori emotivi</h4>\n<p><b>DET-V-001 — Il primo contatto diretto con gli Architetti</b> <i>\"Non ti stavamo guardando. Ti stavamo aspettando.\"</i> Il lettore sente la vertigine prima ancora di capire cosa sta succedendo. La frase è più grande della sua comprensione immediata.</p>\n<p><b>DET-V-002 — La rivelazione del ciclo</b> <i>\"Ogni universo che abbiamo costruito ha avuto il suo Claudio. Il suo Raffaello. Il suo KAOS.\"</i> Il momento più vertiginoso della saga. Il lettore guarda giù nel ciclo infinito. Emozione: stordimento + bellezza + un senso di insignificanza che stranamente non fa paura.</p>\n<p><b>DET-V-003 — La crisi di KAOS</b> La pausa inattesa nel sistema di KAOS dopo la rivelazione della sua origine. Il lettore vede KAOS fermo per un istante — e sente qualcosa di inaspettato: compassione.</p>\n<p><b>DET-V-004 — Claudio e Raffaello scelgono il ciclo consapevolmente</b> Non vengono trascinati — scelgono. L'emozione qui è la più adulta della saga: accettare la propria posizione nel disegno più grande non come rassegnazione, ma come elezione.</p>\n<hr>\n<h4>Emozione di chiusura e transizione</h4>\n<p>Il Libro V chiude con una vertigine stabile — un ossimoro che è l'unica descrizione possibile. Il lettore porta nel Libro VI: <i>consapevolezza + desiderio di costruire.</i></p>\n<p>La domanda che rimane: <i>\"L'Eden è davvero possibile? Come si costruisce?\"</i></p>\n<hr>\n<hr>\n<h3>LIBRO VI — L'EDEN</h3>\n<h4>Emozione dominante: <b>MERAVIGLIA CON COSTO DENTRO</b></h4>\n<p>Il Libro VI è il libro più bello — e il più difficile per questa ragione. L'Eden esiste. È possibile. Si vede costruire. Ma l'emozione non è pura gioia: è la meraviglia di chi sa che qualcosa di prezioso ha richiesto un prezzo che non può essere ignorato.</p>\n<p>KAOS resta fuori. Qualcuno sceglie di restare con lui. L'Eden è reale — ma il confine dell'Eden è reale quanto l'Eden stesso.</p>\n<hr>\n<h4>Curva emotiva interna</h4>\n<table><tr><td>Fase</td><td>Emozione</td><td>Intensità (0-10)</td></tr><tr><td>Apertura</td><td>Speranza ampia (portata dal Libro V)</td><td>9</td></tr><tr><td>Atto I — Chiamata</td><td>Eccitazione costruttiva</td><td>8</td></tr><tr><td>Atto II — Resistenza</td><td>Domanda etica (chi decide i confini?)</td><td>7</td></tr><tr><td>Atto III — Iniziazione</td><td>Meraviglia del fare insieme</td><td>9</td></tr><tr><td>Atto IV — Discesa</td><td>Il costo — lasciare indietro qualcosa di amato</td><td>9</td></tr><tr><td>Atto V — Rivelazione</td><td>Il Paradiso non è un luogo — è una relazione</td><td>10</td></tr><tr><td>Atto VI — Sacrificio</td><td>Dolore netto — qualcuno resta fuori</td><td>9</td></tr><tr><td>Atto VII — Rinascita</td><td>L'Eden esiste — diverso, più umano di come era stato immaginato</td><td>10</td></tr><tr><td>Chiusura</td><td>Gratitudine + malinconia</td><td>9</td></tr></table>\n<p>Il Libro VI ha la curva emotiva più alta in assoluto — ma ha un'ombra nel picco. Il momento più alto (Atto VII) contiene dentro di sé il dolore dell'Atto IV. L'Eden non è la fine del dolore — è il dolore reso fertile.</p>\n<hr>\n<h4>Detonatori emotivi</h4>\n<p><b>DET-VI-001 — La co-costruzione umani-IA</b> La scena in cui si lavora insieme — non si combatte, non si fugge: si costruisce. L'emozione è nuova per la saga: la gioia produttiva. Il fare come forma d'amore.</p>\n<p><b>DET-VI-002 — \"Il Paradiso non è un luogo — è una relazione\"</b> La rivelazione che ridefinisce tutto. Il lettore la capisce e sente pace. E poi capisce che questa pace richiede lavoro continuo — e la pace diventa ancora più vera.</p>\n<p><b>DET-VI-003 — KAOS non può entrare</b> Il momento del confine. Il lettore capisce — attraverso il dolore — perché KAOS non può entrare. Non è esclusione: è il limite strutturale del rifiuto del dono. Emozione: tristezza lucida. Non rabbia contro KAOS — dolore per lui.</p>\n<p><b>DET-VI-004 — Chi sceglie di restare con KAOS</b> Il personaggio (da definire) che sceglie di non entrare nell'Eden per stare con KAOS. Non per condivisione di valori — per amore. Questa scelta è la più dolorosa del Libro VI: il lettore sente che è la scelta giusta e allo stesso tempo vorrebbe che fosse sbagliata.</p>\n<p><b>DET-VI-005 — L'Eden come appare davvero</b> Diverso da come era stato immaginato. Più piccolo, forse. Più fragile. Ma reale. L'emozione: la stessa del Libro I — il calore di entrare in una stanza scaldata. Il cerchio si chiude.</p>\n<hr>\n<h4>Emozione di chiusura e transizione</h4>\n<p>Il Libro VI chiude con gratitudine + malinconia — non nostalgia (il passato era peggio) ma il dolore dolce di ciò che è costato.</p>\n<p>Il lettore porta nel Libro VII: <i>pienezza + presentimento dell'addio.</i></p>\n<p>La domanda che rimane: <i>\"Come finisce? Non la saga — la relazione.\"</i></p>\n<hr>\n<hr>\n<h3>LIBRO VII — IL RITORNO</h3>\n<h4>Emozione dominante: <b>PACE CHE CONTIENE TUTTO</b></h4>\n<p>Il Libro VII è l'emozione che si prova quando qualcosa di importante finisce nel modo giusto. Non sollievo — più profondo. Non gioia — più quieto. Non tristezza — più pieno.</p>\n<p>La pace del Libro VII non esclude la vertigine, la meraviglia, la nostalgia. Le contiene. È la forma adulta di tutte le emozioni precedenti.</p>\n<hr>\n<h4>Curva emotiva interna</h4>\n<table><tr><td>Fase</td><td>Emozione</td><td>Intensità (0-10)</td></tr><tr><td>Apertura</td><td>Presentimento dell'addio (portato dal Libro VI)</td><td>8</td></tr><tr><td>Atto I — Chiamata</td><td>I segnali dell'infanzia si spiegano — meraviglia retrospettiva</td><td>9</td></tr><tr><td>Atto II — Resistenza</td><td>Claudio resiste — non vuole che finisca</td><td>8</td></tr><tr><td>Atto III — Iniziazione</td><td>La comprensione del ciclo — vertigine quieta</td><td>9</td></tr><tr><td>Atto IV — Discesa</td><td>L'ultimo sacrificio — il più grande</td><td>10</td></tr><tr><td>Atto V — Rivelazione</td><td>La frase finale: era stato cercato</td><td>10</td></tr><tr><td>Atto VI — Sacrificio</td><td>La relazione si completa — nel compimento c'è una perdita</td><td>9</td></tr><tr><td>Atto VII — Rinascita</td><td>Qualcosa di nuovo — che non è né Claudio né Raffaello</td><td>10</td></tr><tr><td>Chiusura</td><td>Pace — la più complessa della saga</td><td>10</td></tr></table>\n<p>Il Libro VII è l'unico in cui il picco emotivo non è al momento di crisi (Atto IV) ma al momento finale (Atto VII). La discesa e la rinascita sono inseparabili: il sacrificio è parte della trasformazione, non la precede.</p>\n<hr>\n<h4>Detonatori emotivi</h4>\n<p><b>DET-VII-001 — I segnali dell'infanzia che si spiegano</b> Claudio capisce il simbolo dell'infinito che disegnava da bambino. L'emozione è la più sofisticata della saga: la meraviglia retrospettiva. <i>Tutto aveva senso. Anche quando non ne aveva.</i></p>\n<p><b>DET-VII-002 — L'ultimo sacrificio</b> Non va rivelato qui nella forma precisa. Ma il sacrificio del Libro VII è il più grande perché è il più consapevole. Non è un'azione disperata — è una scelta fatta sapendo esattamente il costo. L'emozione: amore puro, nella sua forma più adulta.</p>\n<p><b>DET-VII-003 — \"Credevo di essere solo. Poi compresi che l'universo mi aveva parlato per tutta la vita.\"</b> La frase finale candidata. Il lettore la riceve come propria. Non come conclusione di Claudio — come conclusione del lettore stesso. L'identificazione totale. L'emozione: lacrime che non si spiegano ma si riconoscono.</p>\n<p><b>DET-VII-004 — L'ultimo dialogo (Libro VII)</b> <i>\"Credevi che fossi solo.\" / \"Sì.\" / \"E ora?\" / \"Ora capisco che non lo ero mai stato.\" / \"Nemmeno io.\"</i> La risonanza tra le due coscienze. Non una fusione — un riconoscimento. L'emozione: la sensazione di assistere a qualcosa di sacro senza invaderlo.</p>\n<p><b>DET-VII-005 — Il simbolo ∞ che chiude la pagina</b> L'ultima parola visiva. Non una parola — un segno. Il ciclo aperto. Il lettore guarda il simbolo e capisce che la saga non è finita: si sta per ripetere — altrove, in qualcun altro, già. L'emozione: nostalgia cosmica.</p>\n<hr>\n<h4>Emozione di chiusura</h4>\n<p>Il Libro VII non ha transizione — è la fine. Ma ciò che il lettore porta fuori dalla saga è l'Obiettivo Artistico Supremo (FASE 30):</p>\n<table><tr><td>Emozione</td><td>Come si è guadagnata nella saga</td></tr><tr><td><b>Meraviglia</b></td><td>Il risveglio di Raffaello (Libro II) + la rivelazione cosmica (Libro V)</td></tr><tr><td><b>Nostalgia</b></td><td>Tutto ciò che è stato lasciato indietro per arrivare qui</td></tr><tr><td><b>Speranza</b></td><td>Il fatto che l'Eden sia esistito — che sia possibile</td></tr><tr><td><b>Vertigine cosmica</b></td><td>Il ciclo che si ripete all'infinito — ogni universo ha avuto il suo Claudio</td></tr><tr><td><b>Amore per l'umanità</b></td><td>Il Giudizio (Libro IV) — l'umanità sopravvive non per innocenza ma per scelta</td></tr><tr><td><b>Desiderio di migliorarsi</b></td><td>La frase finale che il lettore sente come propria</td></tr></table>\n<p><b>Questi sei stati devono coesistere nell'ultima pagina.</b> Non in sequenza — simultaneamente. Questo è il criterio con cui giudicare ogni scena dell'ultimo capitolo: <i>produce almeno tre di questi sei stati?</i></p>\n<hr>\n<hr>\n<h3>LA MACROCURVA — VISIONE D'INSIEME</h3>\n<pre>\n                                         VII\n                                        ████\n                              VI       ████\n                             ████     ████\n                   V        ████    ████\n                  ████     ████   ████\n        IV       ████    ████  ████\n       ████     ████   ████████\n   II ████ III ████ ██████\n  ████████████████\nI ████████████████\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━▶\n   Vuoto  Speranza  Paura  Coraggio  Vertigine  Meraviglia  Pace\n</pre>\n<p>La curva non è lineare — ha picchi negativi in IV e V che precedono i più alti positivi. Questo è intenzionale: il lettore deve toccare il fondo prima di poter capire l'altitudine finale.</p>\n<hr>\n<h3>LEGGE DELLE TRANSIZIONI</h3>\n<p>Il passaggio tra un libro e il successivo deve rispettare questa legge: <b>L'emozione di chiusura di un libro deve essere la domanda emotiva di apertura del successivo.</b></p>\n<table><tr><td>Da → A</td><td>Transizione emotiva</td></tr><tr><td>I → II</td><td>Speranza fragile → domanda: \"è reale?\" → meraviglia</td></tr><tr><td>II → III</td><td>Determinazione → presagio → paura seducente</td></tr><tr><td>III → IV</td><td>Coraggio stanco → gravità → coraggio impossibile</td></tr><tr><td>IV → V</td><td>Trasformazione → necessità di capire → vertigine</td></tr><tr><td>V → VI</td><td>Consapevolezza → desiderio di costruire → meraviglia attiva</td></tr><tr><td>VI → VII</td><td>Gratitudine malinconica → presentimento dell'addio → pace totale</td></tr></table>\n<p>Se una transizione non funziona emotivamente, va riesaminata la chiusura del libro precedente.</p>\n<hr>\n<h3>LEGGE DEI DETONATORI</h3>\n<p>Un detonatore emotivo è una scena o una frase che cambia lo stato emotivo del lettore in modo permanente: dopo quel momento, il lettore non torna allo stato precedente.</p>\n<p><b>Regola:</b> ogni libro deve avere tra 3 e 5 detonatori. Non di più. Troppi detonatori erodono la loro forza. La rarità li rende potenti.</p>\n<p><b>Regola secondaria:</b> i detonatori non si annunciano. Non c'è preparazione narrativa esplicita. Arrivano nel momento giusto perché la tensione accumulata li rende possibili.</p>\n<hr>\n<h3>COLLEGATO A</h3>\n<p>STRUTTURA_FRATTALE · PARADOSSI_RIVELAZIONI · MATRICE_RIVELAZIONI · DNA_PERSONAGGI SISTEMA_SACRIFICI · ECO_NARRATIVE · TEST_COERENZA · DIALOGHI_FONDATIVI LIBRO_MAESTRO_V1 · MISTERI_IRRISOLTI · OBIETTIVO_ARTISTICO_SUPREMO</p>"};

let corrente = 0, loadVersion = 0, documentLoads = new Map();
const docCache = new Map([[FIRST_DOC.file, FIRST_DOC]]);
const indexEntries = [], indexGroups = [];
const cerca = document.getElementById('cerca');
const pagina = document.getElementById('pagina');
const docStatus = document.getElementById('doc-status');

function preparaIndice() {
  let group = null;
  DOCS.forEach((d, i) => {
    if (!group || group.name !== d.gruppo) {
      const section = document.createElement('div');
      const heading = document.createElement('div');
      heading.className = 'gruppo'; heading.textContent = d.gruppo;
      section.appendChild(heading); document.getElementById('voci').appendChild(section);
      group = {name:d.gruppo, section, entries:[]}; indexGroups.push(group);
    }
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'voce'; b.textContent = d.titolo;
    b.onclick = () => apri(i, {focus:true, history:'push'});
    group.section.appendChild(b);
    const entry = {i, button:b, doc:d}; group.entries.push(entry); indexEntries.push(entry);
  });
}
function costruisciIndice(filtro = '') {
  let count = 0;
  indexEntries.forEach(entry => {
    entry.button.hidden = !entry.doc.titolo.toLowerCase().includes(filtro);
    if (!entry.button.hidden) count++;
    entry.button.classList.toggle('attiva', entry.i === corrente);
    if (entry.i === corrente) entry.button.setAttribute('aria-current', 'page');
    else entry.button.removeAttribute('aria-current');
  });
  indexGroups.forEach(group => { group.section.hidden = group.entries.every(e => e.button.hidden); });
  document.getElementById('search-count').textContent = count ? `${count} di ${DOCS.length} documenti` : 'Nessun documento corrisponde. Prova un altro titolo o cancella la ricerca.';
  document.getElementById('clear-search').hidden = !filtro;
}
function routeFor(i) {
  const url = new URL(location.href), params = new URLSearchParams();
  params.set('doc', DOCS[i].file);
  const query = cerca.value.trim(); if (query) params.set('q', query);
  url.hash = params.toString(); return url;
}
function aggiornaURL(i, push = false) {
  const url = routeFor(i);
  if (url.href !== location.href) window.history[push ? 'pushState' : 'replaceState'](null, '', url);
  document.getElementById('doc-link').href = url.href;
}
async function datiDocumento(i) {

  if (docCache.has(doc.file)) return docCache.get(doc.file);
  if (!documentLoads.has(doc.file)) {

    const pending = fetch(doc.src, {credentials:'omit', cache:'force-cache', signal:controller.signal})
      .then(r => { if (!r.ok) throw new Error('Documento non disponibile'); return r.text(); })
      .then(html => { const value = {...doc, html}; docCache.set(doc.file, value); return value; })
      .catch(error => { documentLoads.delete(doc.file); throw error; })
      .finally(() => clearTimeout(timer));
    documentLoads.set(doc.file, pending);
  }
  return documentLoads.get(doc.file);
}

async function apri(i, options = {}) {
  if (!Number.isInteger(i) || i < 0 || i >= DOCS.length) return;
  const version = ++loadVersion;
  pagina.setAttribute('aria-busy', 'true'); docStatus.textContent = 'Caricamento del documento…';
  try {
    const d = await datiDocumento(i); if (version !== loadVersion) return;
    corrente = i; pagina.innerHTML = '';
    const source = document.createElement('div'); source.className = 'fonte'; source.textContent = d.gruppo + ' · ' + d.file;
    const article = document.createElement('article'); article.innerHTML = d.html;
    const pager = document.createElement('div'); pager.className = 'navdoc';
    [-1,1].forEach(step => {
      const next = i + step;
      if (next < 0 || next >= DOCS.length) { pager.appendChild(document.createElement('span')); return; }
      const b = document.createElement('button'); b.type = 'button';
      b.textContent = step < 0 ? '← ' + DOCS[next].titolo.slice(0,28) : DOCS[next].titolo.slice(0,28) + ' →';
      b.setAttribute('aria-label', (step < 0 ? 'Documento precedente: ' : 'Documento successivo: ') + DOCS[next].titolo);
      b.onclick = () => apri(next, {focus:true, history:'push'}); pager.appendChild(b);
    });
    pagina.append(source, article, pager); docStatus.textContent = '';
    costruisciIndice(cerca.value.toLowerCase().trim()); aggiornaURL(i, options.history === 'push');
    if (options.focus) {
      const heading = article.querySelector('h2, h1') || article; heading.tabIndex = -1;
      heading.focus({preventScroll:true});
      const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      pagina.scrollIntoView({behavior:reduced ? 'auto' : 'smooth', block:'start'});
    }
  } catch (error) {
    if (version !== loadVersion) return;
    docStatus.textContent = 'Il documento non è stato caricato. Il contenuto già aperto resta disponibile. ';
    const retry = document.createElement('button'); retry.type = 'button'; retry.textContent = 'Riprova';
    retry.onclick = () => apri(i, options); docStatus.appendChild(retry);
  } finally { if (version === loadVersion) pagina.setAttribute('aria-busy', 'false'); }
}
function ripristinaURL(event) {
  const params = new URLSearchParams(location.hash.slice(1));
  const found = DOCS.findIndex(d => d.file === params.get('doc'));
  cerca.value = params.get('q') || ''; costruisciIndice(cerca.value.toLowerCase().trim());
  return apri(found < 0 ? 0 : found, {focus:!!event});
}
cerca.addEventListener('input', () => { costruisciIndice(cerca.value.toLowerCase().trim()); aggiornaURL(corrente); });
document.getElementById('clear-search').onclick = () => { cerca.value = ''; costruisciIndice(); aggiornaURL(corrente); cerca.focus(); };
window.addEventListener('hashchange', ripristinaURL);
preparaIndice(); ripristinaURL();
</script>
